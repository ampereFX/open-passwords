<!doctype html>
<!-- The inline pairing-code field, loaded as an extension iframe inside the dropdown.
     Keystrokes typed here belong to this extension document, so no listener on the
     web page (not even a capture-phase one on window) sees the code. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        background: transparent;
        color: CanvasText;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      input {
        display: block;
        margin: 4px 12px 8px;
        width: calc(100% - 24px);
        box-sizing: border-box;
        padding: 9px;
        font: 16px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: 5px;
        text-align: center;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 10px;
        background: light-dark(rgba(255, 255, 255, 0.55), rgba(0, 0, 0, 0.28));
        color: CanvasText;
      }
      #status { padding: 0 12px 6px; font-size: 12px; min-height: 16px; color: rgba(128, 128, 128, 0.9); }
      #status.err { color: #ff453a; }
      #again {
        all: unset;
        display: block;
        padding: 0 12px 10px;
        font-size: 12px;
        opacity: 0.7;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code" aria-label="Code shown on your Mac" />
    <div id="status" role="status"></div>
    <button id="again" type="button">Get a new code</button>
    <script src="pin.js"></script>
  </body>
</html>
